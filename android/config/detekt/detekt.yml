# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
# Limits mirror the hard limits in AGENTS.md.
complexity:
  # Framework callbacks (SurfaceHolder.Callback, View lifecycle) are mandatory overrides, not design choices.
  # The stroke controller is an input state machine (one function per MotionEvent phase plus the eraser path); the
  # stroke store is a page state machine (add/undo/redo/clear/erase). Both are one concept with one method per event.
  TooManyFunctions:
    ignoreOverridden: true
    # Coordinators: one small function per platform event, kept flat on purpose. FrameLayer does the same for the
    # harness' WebView frames: placement, bridge messages and touch routing, one method per event.
    excludes:
      [
        '**/StylusStrokeController.kt',
        '**/PageViewModel.kt',
        '**/SyncCore.kt',
        '**/Glyph.kt',
        '**/frames/FrameLayer.kt',
        # The tool state: one small method per tool choice (pen, marker, eraser, lasso, shape, colour, size).
        '**/tools/ToolState.kt',
      ]
  # Axis/bounds checks naturally chain several comparisons; keep a ceiling but above detekt's default of 3.
  ComplexCondition:
    allowedConditions: 4
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 7

style:
  # Guard clauses and early returns are preferred over nesting (AGENTS.md); detekt's default of 2 is stricter
  # than the codebase rule, so allow a few exits per function while still catching sprawling ones.
  ReturnCount:
    max: 4

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
