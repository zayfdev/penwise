[workspace]
resolver = "3"
members = [
    "crates/penwise-core",
    "crates/penwise-ffi",
    "crates/penwise-fixtures",
    "crates/penwise-mcp",
    "crates/penwise-proto",
    "crates/penwise-server",
    "crates/penwise-testkit",
    "crates/penwise-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pure-Rust musl port; the only transcendental math allowed in penwise-core (determinism).
libm = "0.2.16"
thiserror = "2"
# M2 editing: per-page R*-tree item index (MIT OR Apache-2.0, MSRV 1.85; deps heapless, num-traits, smallvec).
rstar = "0.13.0"
# M2 editing: integer polygon booleans for fill cleanup and fill erase (MIT OR Apache-2.0, MSRV 1.88; deps
# i_float/i_shape/i_tree/i_key_sort, all MIT). Default features off: no rayon (`allow_multithreading`).
i_overlay = { version = "9.1.0", default-features = false }
# Server-only raster; enabled through penwise-core's `raster` feature, never on wasm.
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
wasm-bindgen-test = "0.3.79"
# Dev tool only (`penwise-fixtures`): gzip input and CLI error reporting for the fixture converter.
anyhow = "1"
flate2 = "1.1"
# Hand-written JNI for penwise-ffi (android-stack.md §3).
jni = "0.22.4"
# M3 server + viewer (see docs/research/server-stack.md for versions and licenses).
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "signal", "fs"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
# Server-only OCR client for a local Ollama (MIT OR Apache-2.0). No TLS features: the model is on localhost, and
# the alternative pulls a certificate-root bundle under a data license this project does not ship.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# Server-only pairing QR rendering (MIT OR Apache-2.0). No image features: modules are drawn into tiny-skia.
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
wasm-bindgen = "0.2.129"
tokio-tungstenite = "0.30.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
# Geometry code uses conventional math names (x, y, d, r, tilt_x/tilt_y); these pedantic lints fight that.
similar_names = "allow"
many_single_char_names = "allow"
