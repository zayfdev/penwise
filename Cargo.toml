[workspace]
resolver = "3"
members = ["crates/penwise-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pure-Rust musl port; the only transcendental math allowed in penwise-core (determinism).
libm = "0.2.16"
thiserror = "2"
# Server-only raster; enabled through penwise-core's `raster` feature, never on wasm.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
wasm-bindgen-test = "0.3.79"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
