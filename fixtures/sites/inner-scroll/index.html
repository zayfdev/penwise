<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>inner-scroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; height: 1500px; }
  /* A scroll box inside the page: its 3000 px of content do not count towards the document height. */
  #side { position: absolute; left: 24px; top: 100px; width: 320px; height: 300px; overflow: auto; background: #def; }
  #side .row { height: 60px; border-bottom: 1px solid #99c; padding: 8px; }
  #main { position: absolute; left: 400px; top: 100px; width: 600px; height: 300px; background: #fed; }
</style>
</head>
<body>
<div id="side">
  <div class="row">1</div><div class="row">2</div><div class="row">3</div><div class="row">4</div>
  <div class="row">5</div><div class="row">6</div><div class="row">7</div><div class="row">8</div>
  <div class="row">9</div><div class="row">10</div><div class="row">11</div><div class="row">12</div>
  <div class="row">13</div><div class="row">14</div><div class="row">15</div><div class="row">16</div>
  <div class="row">17</div><div class="row">18</div><div class="row">19</div><div class="row">20</div>
  <div class="row">21</div><div class="row">22</div><div class="row">23</div><div class="row">24</div>
  <div class="row">25</div><div class="row">26</div><div class="row">27</div><div class="row">28</div>
  <div class="row">29</div><div class="row">30</div><div class="row">31</div><div class="row">32</div>
  <div class="row">33</div><div class="row">34</div><div class="row">35</div><div class="row">36</div>
  <div class="row">37</div><div class="row">38</div><div class="row">39</div><div class="row">40</div>
  <div class="row">41</div><div class="row">42</div><div class="row">43</div><div class="row">44</div>
  <div class="row">45</div><div class="row">46</div><div class="row">47</div><div class="row">48</div>
  <div class="row">49</div><div class="row">50</div>
</div>
<div id="main"><p>The page itself.</p></div>
</body>
</html>
