<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>smooth-scroll</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  /* Smooth scrolling: a plain `scrollTo(y)` only starts an animation that would still be running at capture. */
  html { scroll-behavior: smooth; }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #fff; color: #111; }
  .gap { height: 1500px; }
  .reveal { height: 400px; margin: 0 24px; background: #0a0; opacity: 0; transition: opacity 0.2s linear; }
  .reveal.in { opacity: 1; }
</style>
</head>
<body>
<div class="gap"></div>
<div class="reveal" id="r1"></div>
<div class="gap"></div>
<script>
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add("in");
    });
  }, { threshold: 0.1 });
  document.querySelectorAll(".reveal").forEach(function (node) { observer.observe(node); });
</script>
</body>
</html>
