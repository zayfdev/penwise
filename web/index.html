<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Penwise</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <h1>Penwise</h1>
        <button id="pair-toggle" type="button">Pair device</button>
      </header>
      <div id="search-panel">
        <input type="search" placeholder="Search handwriting" aria-label="Search handwriting" />
        <div data-results></div>
      </div>
      <nav id="pages"></nav>
      <section id="frames-panel">
        <h2>Frames</h2>
      </section>
      <section id="text-panel">
        <button data-text-read type="button">Read page as text</button>
        <pre data-text-body></pre>
      </section>
      <section id="dead-panel" hidden>
        <h2>Refused by the server</h2>
        <div data-dead-list></div>
        <button data-dead-export type="button">Export</button>
      </section>
      <section id="pair-panel" hidden>
        <img alt="Pairing QR code" width="148" height="148" />
        <div data-pair-code></div>
        <button data-pair-new type="button">New code</button>
      </section>
    </aside>
    <main>
      <div id="toolbar">
        <div id="status" data-state="closed">connecting…</div>
      </div>
      <div id="stage">
        <canvas id="committed"></canvas>
        <div id="frames"></div>
        <canvas id="live"></canvas>
        <div id="frame-chips"></div>
        <div id="mark-chips"></div>
      </div>
    </main>
    <div id="unlock" hidden>
      <form>
        <label>Pairing code <input type="text" autocomplete="off" inputmode="numeric" /></label>
        <button type="submit">Connect</button>
        <p data-message></p>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
