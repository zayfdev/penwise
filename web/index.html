<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Penwise</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; height: 100%; background: #e8e8ea; font: 14px system-ui, sans-serif; }
      body { display: flex; height: 100%; }
      #sidebar {
        width: 224px; flex: 0 0 224px; display: flex; flex-direction: column;
        background: #f6f6f7; border-right: 1px solid #dcdce0; overflow: hidden;
      }
      #sidebar header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 12px; font-weight: 600; border-bottom: 1px solid #e3e3e6;
      }
      #add-page {
        border: 1px solid #cfcfd4; background: #fff; border-radius: 6px;
        width: 24px; height: 24px; line-height: 1; cursor: pointer; font-size: 16px;
      }
      #library { flex: 1; overflow-y: auto; padding: 6px 0; }
      .notebook {
        padding: 10px 12px 4px; font-size: 11px; letter-spacing: 0.04em;
        text-transform: uppercase; color: #7a7a82;
      }
      .page {
        display: flex; align-items: center; gap: 8px; padding: 6px 12px;
        cursor: pointer; border-left: 3px solid transparent;
      }
      .page:hover { background: #ececef; }
      .page.active { background: #e2e8f5; border-left-color: #4d6fd6; }
      .page .glyph { width: 14px; color: #8a8a93; }
      .page .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .page .tools { display: none; gap: 2px; }
      .page:hover .tools, .page.active .tools { display: flex; }
      .page .tools button {
        border: none; background: transparent; cursor: pointer; color: #6a6a73;
        font-size: 13px; padding: 0 3px; border-radius: 4px;
      }
      .page .tools button:hover { background: #d8d8de; color: #222; }
      .page .tools button:disabled { opacity: 0.3; cursor: default; }
      #new-page {
        display: none; flex-direction: column; gap: 8px;
        padding: 10px 12px; border-top: 1px solid #e3e3e6; background: #fbfbfc;
      }
      #new-page.open { display: flex; }
      #new-page input[type="text"] { padding: 5px 7px; border: 1px solid #cfcfd4; border-radius: 6px; }
      #new-page label { display: flex; align-items: center; gap: 5px; font-size: 12px; }
      #new-page .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
      #new-page .actions { display: flex; gap: 6px; justify-content: flex-end; }
      #new-page button {
        padding: 5px 10px; border-radius: 6px; border: 1px solid #cfcfd4; background: #fff; cursor: pointer;
      }
      #new-page button[type="submit"] { background: #4d6fd6; border-color: #4d6fd6; color: #fff; }
      #wrap { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
      canvas { background: #fff; box-shadow: 0 2px 16px rgba(0, 0, 0, 0.18); }
      #status {
        position: fixed; left: 12px; bottom: 10px; padding: 4px 10px; border-radius: 999px;
        background: rgba(0, 0, 0, 0.72); color: #fff; font-size: 12px;
      }
      #status.offline { background: #a3241e; }
      @media (max-width: 700px) {
        #sidebar { width: 150px; flex-basis: 150px; }
      }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <header>
        <span>Penwise</span>
        <button id="add-page" title="New page">＋</button>
      </header>
      <div id="library"></div>
      <form id="new-page">
        <input type="text" name="title" placeholder="Page title (optional)" />
        <div class="row">
          <label><input type="radio" name="template" value="blank" checked /> Blank</label>
          <label><input type="radio" name="template" value="ruled" /> Ruled</label>
          <label><input type="radio" name="template" value="grid" /> Grid</label>
          <label><input type="radio" name="template" value="infinite" /> Infinite</label>
        </div>
        <div class="actions">
          <button type="submit">Create</button>
        </div>
      </form>
    </aside>
    <div id="wrap"><canvas id="page" width="1600" height="2560"></canvas></div>
    <div id="status" class="offline">connecting…</div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
