# penwise-core clippy config. Clippy does not merge configs: this repeats every root clippy.toml setting.
too-many-lines-threshold = 80
too-many-arguments-threshold = 7
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Determinism (core-determinism.md §1): std float math has platform-dependent precision, and f32/f64
# min/max may return either zero on ±0 ties. Use `libm::*f` / `libm::*` and `crate::float::{min, max}`.
disallowed-methods = [
    { path = "f32::sin", reason = "use libm (determinism)" },
    { path = "f32::cos", reason = "use libm (determinism)" },
    { path = "f32::tan", reason = "use libm (determinism)" },
    { path = "f32::asin", reason = "use libm (determinism)" },
    { path = "f32::acos", reason = "use libm (determinism)" },
    { path = "f32::atan", reason = "use libm (determinism)" },
    { path = "f32::atan2", reason = "use libm (determinism)" },
    { path = "f32::sin_cos", reason = "use libm (determinism)" },
    { path = "f32::sinh", reason = "use libm (determinism)" },
    { path = "f32::cosh", reason = "use libm (determinism)" },
    { path = "f32::tanh", reason = "use libm (determinism)" },
    { path = "f32::asinh", reason = "use libm (determinism)" },
    { path = "f32::acosh", reason = "use libm (determinism)" },
    { path = "f32::atanh", reason = "use libm (determinism)" },
    { path = "f32::exp", reason = "use libm (determinism)" },
    { path = "f32::exp2", reason = "use libm (determinism)" },
    { path = "f32::exp_m1", reason = "use libm (determinism)" },
    { path = "f32::ln", reason = "use libm (determinism)" },
    { path = "f32::log", reason = "use libm (determinism)" },
    { path = "f32::log2", reason = "use libm (determinism)" },
    { path = "f32::log10", reason = "use libm (determinism)" },
    { path = "f32::ln_1p", reason = "use libm (determinism)" },
    { path = "f32::powf", reason = "use libm (determinism)" },
    { path = "f32::powi", reason = "use libm (determinism)" },
    { path = "f32::cbrt", reason = "use libm (determinism)" },
    { path = "f32::hypot", reason = "use libm (determinism)" },
    { path = "f32::mul_add", reason = "wasm has no scalar FMA and it invites contraction-style rewrites; use plain * and + (determinism)" },
    { path = "f32::min", reason = "sign-of-zero ambiguity: use crate::float::min/max or clamp (determinism)" },
    { path = "f32::max", reason = "sign-of-zero ambiguity: use crate::float::min/max or clamp (determinism)" },
    { path = "f64::sin", reason = "use libm (determinism)" },
    { path = "f64::cos", reason = "use libm (determinism)" },
    { path = "f64::tan", reason = "use libm (determinism)" },
    { path = "f64::asin", reason = "use libm (determinism)" },
    { path = "f64::acos", reason = "use libm (determinism)" },
    { path = "f64::atan", reason = "use libm (determinism)" },
    { path = "f64::atan2", reason = "use libm (determinism)" },
    { path = "f64::sin_cos", reason = "use libm (determinism)" },
    { path = "f64::sinh", reason = "use libm (determinism)" },
    { path = "f64::cosh", reason = "use libm (determinism)" },
    { path = "f64::tanh", reason = "use libm (determinism)" },
    { path = "f64::asinh", reason = "use libm (determinism)" },
    { path = "f64::acosh", reason = "use libm (determinism)" },
    { path = "f64::atanh", reason = "use libm (determinism)" },
    { path = "f64::exp", reason = "use libm (determinism)" },
    { path = "f64::exp2", reason = "use libm (determinism)" },
    { path = "f64::exp_m1", reason = "use libm (determinism)" },
    { path = "f64::ln", reason = "use libm (determinism)" },
    { path = "f64::log", reason = "use libm (determinism)" },
    { path = "f64::log2", reason = "use libm (determinism)" },
    { path = "f64::log10", reason = "use libm (determinism)" },
    { path = "f64::ln_1p", reason = "use libm (determinism)" },
    { path = "f64::powf", reason = "use libm (determinism)" },
    { path = "f64::powi", reason = "use libm (determinism)" },
    { path = "f64::cbrt", reason = "use libm (determinism)" },
    { path = "f64::hypot", reason = "use libm (determinism)" },
    { path = "f64::mul_add", reason = "wasm has no scalar FMA and it invites contraction-style rewrites; use plain * and + (determinism)" },
    { path = "f64::min", reason = "sign-of-zero ambiguity: use crate::float::min/max or clamp (determinism)" },
    { path = "f64::max", reason = "sign-of-zero ambiguity: use crate::float::min/max or clamp (determinism)" },
]
