[package]
name = "penwise-core"
description = "Pen stroke model, geometry, codec and rasterization shared by every Penwise surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Geometry → pixels via tiny-skia. Enabled only by penwise-server; wasm and FFI builds never enable it
# (build them with `-p`, never `--workspace`, so feature unification cannot turn it on).
raster = ["dep:tiny-skia"]

[dependencies]
libm.workspace = true
thiserror.workspace = true
tiny-skia = { workspace = true, optional = true }

# Wasm-only dev-dep keeps native/Android dependency graphs clean (core-determinism.md §4).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true

# PNG goldens and the brush sheet need the rasterizer.
[[test]]
name = "raster_golden"
required-features = ["raster"]

[[example]]
name = "brush_sheet"
required-features = ["raster"]
