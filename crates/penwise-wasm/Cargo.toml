[package]
name = "penwise-wasm"
description = "wasm-bindgen bindings of penwise-core + penwise-proto for the browser viewer (types and conversion only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Never enable `raster`: the browser rasterizes with Canvas2D. Build with `-p penwise-wasm` (never
# `--workspace`) so feature unification with penwise-server cannot turn it on.
penwise-core = { path = "../penwise-core" }
penwise-proto = { path = "../penwise-proto" }
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
