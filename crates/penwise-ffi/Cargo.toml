[package]
name = "penwise-ffi"
description = "JNI bindings: penwise-core ink engine plus the SyncCore / SceneHandle tablet surfaces (bytes in, bytes out)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "penwise_ffi"
# `rlib` lets the host tests in `tests/` link the same code the `cdylib` ships.
crate-type = ["cdylib", "rlib"]

[dependencies]
penwise-core = { path = "../penwise-core" }
penwise-proto = { path = "../penwise-proto" }
jni.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Headless-tablet test: a real in-process server plus the shared harness checks.
penwise-server = { path = "../penwise-server" }
penwise-testkit = { path = "../penwise-testkit" }
futures-util.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

# Mirrors [workspace.lints] except `unsafe_code`: JNI needs `#[unsafe(no_mangle)] extern "system"` entry
# points and the boxed-handle round trip. Only this crate may use unsafe; lib.rs opts in with
# `#![allow(unsafe_code)]`, every other module stays denied.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
similar_names = "allow"
many_single_char_names = "allow"
