[package]
name = "penwise-server"
description = "Penwise PC server: op log in SQLite, WebSocket sync, pairing, PNG render and the embedded web viewer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "penwise-server"
path = "src/main.rs"

[dependencies]
penwise-core = { path = "../penwise-core", features = ["raster"] }
penwise-proto = { path = "../penwise-proto" }
axum.workspace = true
flate2.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
qrcode.workspace = true
serde.workspace = true
sha2.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tiny-skia.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
penwise-testkit = { path = "../penwise-testkit" }

[target.'cfg(target_os = "linux")'.dependencies]
inotify.workspace = true

[lints]
workspace = true
